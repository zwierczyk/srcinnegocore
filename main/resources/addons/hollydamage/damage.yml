enabled: true
mode: advanced

simple:
  multiplier: 0.51

advanced:
  weapons-match-all: false
  weapons:
    - NETHERITE_SWORD
    - DIAMOND_SWORD
  # Mnoznik obrazen wg materialu broni: diax bije 15% slabiej od netherite.
  weapon-multipliers:
    NETHERITE_SWORD: 1.0
    DIAMOND_SWORD: 0.85
  armor:
    - PLAYER_HEAD
    - LEATHER_HELMET
    - LEATHER_CHESTPLATE
    - LEATHER_LEGGINGS
    - LEATHER_BOOTS
  sharpness:
    start: 3
    step: 2
  protection:
    start: 2
    step: 2
  # Slot broni minus slot zbroi. Vanilla Sharpness 61 NIE wchodzi w baze.
  multipliers:
    '-7': 0.55
    '-6': 0.60
    '-5': 0.64
    '-4': 0.68
    '-3': 0.72
    '-2': 0.77
    '-1': 0.81
    '0': 0.85
    '1': 0.88
    '2': 0.90
    '3': 0.93
    '4': 0.95
    '5': 0.98
    '6': 1.00
    '7': 1.03

# Stala baza hita (HP). Kazdy miecz ma te sama baze — Sharpness 100 = perk 30, nie 43.
# min-level → slot -7 (np. perk 2), max-level → slot 7 (perk 30), srodek → slot 0 (perk 16).
# Wpisz zakres perkow uzywanych na serwerze (np. 17–30 albo 2–30).
# diamond-set-penalty: pelny diax prot 4 bierze 12% wiecej niz netherite prot 5 (lekko gorszy).
scale:
  base-damage: 16.0
  min-level: 2
  max-level: 30
  diamond-set-penalty: 0.12
  diamond-eq-netherite-prot5: true

# Siła/Słabość: dodatek do bazy na poziom (Siła I = 1). Vanilla 1.9+ to +3 / -4.
effects:
  strength-per-level: 3.0
  weakness-per-level: 4.0

# <= 0 = bez limitu
max-damage: 60

debug:
  enabled: true
  permission: Holly.damage.debug
  notify-attacker: true
  notify-victim: true

armor-durability:
  enabled: true
  divisor: 8.0

# Mnoznik obrazen przy biciu dripstonem (1.0 = jak vanilla).
dripstone:
  enabled: true
  multiplier: 1.0
  materials:
    - POINTED_DRIPSTONE

skypvp:
  active-profile: skypvp-aktualne
  profiles:
    anarchiaboxpvp:
      weapons-match-all: false
      weapons:
        - DIAMOND_SWORD
        - NETHERITE_SWORD
      weapon-multipliers:
        NETHERITE_SWORD: 1.0
        DIAMOND_SWORD: 0.85
      armor:
        - DIAMOND_HELMET
        - DIAMOND_CHESTPLATE
        - DIAMOND_LEGGINGS
        - DIAMOND_BOOTS
        - NETHERITE_HELMET
        - NETHERITE_CHESTPLATE
        - NETHERITE_LEGGINGS
        - NETHERITE_BOOTS
      sharpness:
        start: 3
        step: 2
      protection:
        start: 2
        step: 2
    skypvp-og:
      weapons-match-all: true
      weapons: []
      armor:
        - PLAYER_HEAD
        - LEATHER_HELMET
        - LEATHER_CHESTPLATE
        - LEATHER_LEGGINGS
        - LEATHER_BOOTS
      sharpness:
        start: 3
        step: 2
      protection:
        start: 2
        step: 2
    skypvp-aktualne:
      weapons-match-all: false
      weapons:
        - NETHERITE_SWORD
        - DIAMOND_SWORD
      weapon-multipliers:
        NETHERITE_SWORD: 1.0
        DIAMOND_SWORD: 0.85
      armor:
        - PLAYER_HEAD
        - LEATHER_HELMET
        - LEATHER_CHESTPLATE
        - LEATHER_LEGGINGS
        - LEATHER_BOOTS
      sharpness:
        start: 3
        step: 2
      protection:
        start: 2
        step: 2
