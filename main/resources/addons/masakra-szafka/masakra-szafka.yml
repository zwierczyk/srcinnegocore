# Edytowalny config: plugins/HollyCore/masakra-szafka.yml
# /szafka — szafka gracza (kostiumy i talizmany).
# /aszafka give <kostium|talizman> <nick> <id> [czas] [ilość] — wydaje bon (PPM = aktywacja).
# /aszafka zabierz <nick> <id> — zabiera kostium/talizman graczowi online.
# /aszafka reload — wczytuje zmiany z tego pliku. Istniejący plik nie jest nadpisywany.
# Czas: 30m, 12h, 7d, 2w, 1msc, 1d12h albo perm. Bez czasu bon dostaje default-duration.
# Kostiumy są wyłącznie wizualne: inni gracze widzą skórzany zestaw, prawdziwy pancerz się nie zmienia.
# Talizmany nie mają wyglądu — jedynie symbol przy nicku (nametag.enabled).
# Perki: mining-percent, damage-percent, damage-reduction-percent, lifesteal-chance, lifesteal-hearts,
# no-hunger, effects (np. HASTE:0, SPEED:1).
# mining-percent działa na bloki z generatorów oraz bloki z settings.mining-blocks, których drop różni się
# od samego bloku (ruda -> surowiec). Nie dodawaj tu bloków odzyskiwalnych z dropu (np. STONE: bruk -> piec -> kamień),
# bo postawienie i wykopanie ich w kółko pozwalałoby dupić drop.
# effects-blocked-regions/worlds wyłączają perki (wygląd kostiumu zostaje).
settings:
  max-talismans: 3
  keep-elytra-visible: true
  hide-costume-when-invisible: true
  gui-click-cooldown-ms: 200
  date-format: 'dd.MM.yyyy HH:mm:ss'
  effects-blocked-regions: []
  effects-blocked-worlds: []
  mining-blocks:
    - '*_ORE'
    - AMETHYST_CLUSTER
