general:
  debug: false
  autoSaveInterval: 5
  confirmDelete: true

teleport:
  countdown: 5
  showMilliseconds: true
  cancelOnMove: true
  maxMoveDistance: 0.5
  cancelOnDamage: true
  cancelOnAttack: false
  
  countdownSound:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 0.5
    pitch: 1.0
  
  showParticles: false
  teleportParticles:
    type: PORTAL
    amount: 50
    offsetX: 0.5
    offsetY: 1.0
    offsetZ: 0.5
    speed: 0.5

homes:
  minNameLength: 3
  maxNameLength: 20
  allowedNameCharacters: "^[a-zA-Z0-9\\s!@#$%^&*()_+\\-=\\[\\]{};':,.<>?/\\\\|`~&#]+$"
  allowedWorlds: []
  blockedWorlds:
    - ninjaevent
    - ninja_dungeon_
  defaultShowCoordinates: false
  
  worldguard:
    enabled: true
    blockedRegions: []

homeSlots:
  slot1:
    guiSlot: 19
    homeNumber: 1
    permission: 'holly.home.1'
    defaultName: '&eDomek #1'
    defaultIcon: WHITE_BED
  
  slot2:
    guiSlot: 20
    homeNumber: 2
    permission: 'holly.home.2'
    defaultName: '&eDomek #2'
    defaultIcon: WHITE_BED
  
  slot3:
    guiSlot: 21
    homeNumber: 3
    permission: 'holly.home.3'
    defaultName: '&eDomek #3'
    defaultIcon: WHITE_BED
  
  slot4:
    guiSlot: 22
    homeNumber: 4
    permission: 'holly.home.4'
    defaultName: '&eDomek #4'
    defaultIcon: WHITE_BED
  
  slot5:
    guiSlot: 23
    homeNumber: 5
    permission: 'holly.home.5'
    defaultName: '&eDomek #5'
    defaultIcon: WHITE_BED
  
  slot6:
    guiSlot: 24
    homeNumber: 6
    permission: 'holly.home.6'
    defaultName: '&eDomek #6'
    defaultIcon: WHITE_BED
  
  slot7:
    guiSlot: 25
    homeNumber: 7
    permission: 'holly.home.7'
    defaultName: '&eDomek #7'
    defaultIcon: WHITE_BED

gui:
  mainMenu:
    title: '&8Twoje domki'
    size: 45
    
    decorations: {}
    
    closeButton:
      slot: 40
      material: BARRIER
      name: '&cZamknij!'
      glow: false
    
    noPermissionItem:
      material: RED_BED
      name: '&eDomek #{HOME_NUMBER}'
      lore:
        - '&7'
        - '&8 » &cNie posiadasz wystarczającej rangi!'
        - '&7'
      glow: false
    
    unsetItem:
      material: LIME_BED
      name: '&eDomek #{HOME_NUMBER}'
      lore:
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby zapisać lokalizacje!'
        - '&7'
      glow: false
    
    setItemWithoutCoords:
      material: '{CURRENT_ICON}'
      name: '&eDomek #{HOME_NUMBER}'
      lore:
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby przeteleportować!'
        - '&8 » &7Kliknij &fPRAWYM&7, aby zarządzać domkiem!'
        - '&7'
      glow: false
    
    setItemWithCoords:
      material: '{CURRENT_ICON}'
      name: '&eDomek #{HOME_NUMBER}'
      lore:
        - '&7'
        - '&8 » &7Domek znajduje się na &fx: {X}, y: {Y}, z: {Z}'
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby przeteleportować!'
        - '&8 » &7Kliknij &fPRAWYM&7, aby zarządzać domkiem!'
        - '&7'
      glow: false
  
  editMenu:
    title: '&8Domek #{NUMBER}'
    size: 45
    decorations: {}

    iconButton:
      slot: 21
      material: STRUCTURE_VOID
      name: '&6Zmień ikonke'
      lore:
        - '&8 » &7Możesz wybrać ikonkę domku.'
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby zmienić!'
      glow: false
    
    coordinatesButton:
      slot: 22
      material: IRON_NUGGET
      name: '&6Wyświetlanie koordynatów'
      lore:
        - '&8 » &7Aktualnie: {STATUS}'
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby zmienić!'
      glow: false
      statusEnabled: '&atak'
      statusDisabled: '&cnie'
    
    deleteButton:
      slot: 23
      material: RED_TERRACOTTA
      name: '&cUsuń'
      lore:
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby usunąć dom!'
      glow: false
    
    backButton:
      slot: 40
      material: BARRIER
      name: '&cPowrót!'
      glow: false
  
  deleteConfirmMenu:
    title: '&8Usuwanie domku #{NUMBER}'
    size: 45
    decorations: {}
    
    confirmButton:
      slot: 20
      material: LIME_WOOL
      name: '&aZatwierdzam'
      lore:
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby usunąć domek!'
        - '&7'
      glow: false
    
    cancelButton:
      slot: 24
      material: RED_WOOL
      name: '&4Anuluj'
      lore:
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby anulować!'
        - '&7'
      glow: false
    
    backButton:
      slot: 40
      material: BARRIER
      name: '&cPowrót!'
      glow: false
  
  iconPickerMenu:
    title: '&8Wybierz ikonę'
    size: 54
    itemSlots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    decorations: {}
    
    itemFormat:
      name: '&7Ikona: &6{MATERIAL_NAME}'
      lore:
        - '&8 » &7Kliknij &fLEWYM&7, aby wybrać!'
      glow: false
    
    previousPageButton:
      slot: 48
      material: ARROW
      name: '&cPoprzednia strona'
      lore: []
      glow: false
    
    nextPageButton:
      slot: 50
      material: ARROW
      name: '&aNastępna strona'
      lore: []
      glow: false
    
    backButton:
      slot: 49
      material: BARRIER
      name: '&cPowrót!'
      lore: []
      glow: false
    
    searchButton:
      slot: 4
      material: OAK_SIGN
      name: '&aSzybka wyszukiwarka'
      lore:
        - '&8 » &7Dzięki temu narzędziu'
        - '&8 » &7możesz szybko znaleźć'
        - '&8 » &7potrzebny blok.'
        - '&7'
        - '&8 » &7Kliknij &fLEWYM&7, aby wyszukać!'
      glow: false

    searchSign:
      line1: ''
      line2: '/\'
      line3: '&7Wpisz nazwę bloku'
      line4: '&7jakiego szukasz'
    
    hiddenMaterials:
      - AIR
      - CAVE_AIR
      - VOID_AIR
      - BARRIER
      - STRUCTURE_VOID
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK
      - JIGSAW

sounds:
  openGui:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.5
    pitch: 1.0
  
  closeGui:
    enabled: false
    sound: BLOCK_CHEST_CLOSE
    volume: 0.5
    pitch: 1.0
  
  guiClick:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 0.3
    pitch: 1.0
  
  setHome:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0
  
  deleteHome:
    enabled: true
    sound: ENTITY_ITEM_BREAK
    volume: 1.0
    pitch: 0.8
  
  teleportStart:
    enabled: true
    sound: BLOCK_PORTAL_TRIGGER
    volume: 0.5
    pitch: 1.0
  
  teleportSuccess:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  
  teleportCancel:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  
  changeName:
    enabled: true
    sound: BLOCK_ANVIL_USE
    volume: 0.5
    pitch: 1.2
  
  changeIcon:
    enabled: true
    sound: ITEM_ARMOR_EQUIP_LEATHER
    volume: 1.0
    pitch: 1.0
  
  changeLocation:
    enabled: true
    sound: BLOCK_BEACON_ACTIVATE
    volume: 0.5
    pitch: 1.5
  
  error:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8
  
  noPermission:
    enabled: true
    sound: BLOCK_ANVIL_LAND
    volume: 0.5
    pitch: 0.5

particles:
  enabled: true
  
  setHome:
    enabled: true
    type: VILLAGER_HAPPY
    amount: 20
    offsetX: 0.5
    offsetY: 0.5
    offsetZ: 0.5
    speed: 0.1
  
  deleteHome:
    enabled: true
    type: SMOKE_NORMAL
    amount: 15
    offsetX: 0.3
    offsetY: 0.3
    offsetZ: 0.3
    speed: 0.05
  
  teleportCountdown:
    enabled: true
    type: PORTAL
    amount: 10
    offsetX: 0.3
    offsetY: 0.5
    offsetZ: 0.3
    speed: 0.5
    interval: 10

commands:
  home:
    enabled: true
    aliases:
      - 'h'
      - 'dom'
    cooldown: 0
    cooldownForAdmins: false

security:
  maxHeight: 256
  minHeight: -70
  blockAirHomes: false
  blockLavaHomes: true
  blockFireHomes: true

performance:
  asyncLoading: true
  asyncSaving: true
  saveQueueSize: 50
  batchSaves: true
  batchSize: 10
  optimizeGUI: true
  cacheGUIItems: true
  maxConcurrentGUI: 50
