# Edytowalny config: plugins/HollyCore/masakra-customitems.yml
# /krzysmcitems — GUI; /krzysmcitems reload — wczytaj zmiany; /krzysmcitems config — ścieżka.
# /krzysmcitems give <nick> <id> — wydaj przedmiot.
# Istniejący config nie jest zastępowany domyślnym przy restarcie ani przeładowaniu.
# Uprawnienie do GUI i wydawania: Holly.masakra.items (domyślnie OP).
# Wszystkie eventówki są niezniszczalne i wielokrotnego użytku. Cooldown jest osobny dla każdego gracza i przedmiotu.
# Zablokowane regiony sprawdzane są u użytkownika oraz celu. OP również podlega blokadzie.
blocked-regions:
  - spawn
  - bezpieczna
blocked-worlds: []
respect-pvp-deny: true
# sounds.used = użycie przedmiotu (główka: założenie; kilof: udane kopanie).
# sounds.received = dźwięk dla gracza, na którego zadziałał przedmiot.
# name: nazwa dźwięku Bukkit; enabled: false lub name: NONE wyłącza dźwięk.
# volume = głośność, pitch = wysokość, min-interval-ms = odstęp między dźwiękami.
presentation-version: 2
gui:
  rows: 6
  title: '&8✦ &6&lMASAKRA &8| &fPrzedmioty eventowe'
messages:
  no-permission: '&c✘ &7Nie masz uprawnień do tego menu.'
  only-player: '&c✘ &7Ta komenda jest dostępna tylko w grze.'
  reloaded: '&a✔ &7Przeładowano &fmasakra-customitems&7.'
  usage: '&cUżycie: /krzysmcitems [reload|config|give <nick> <id>|resetcooldown <nick|all>]'
  inventory-full: '&c✘ &7Zwolnij miejsce w ekwipunku.'
  blocked-region: '&c✘ &7Nie możesz użyć tego przedmiotu w tym regionie.'
  helmet-occupied: '&c✘ &7Zdejmij obecny hełm, aby założyć głowę Krzysimira.'
  cooldown: '&c⌛ &7Przedmiot będzie gotowy za &f{TIME} s&7.'
  cooldown-reset-player: '&aZresetowano cooldowny eventówek gracza &f{PLAYER}&a.'
  cooldown-reset-all: '&aZresetowano cooldowny eventówek wszystkich graczy.'
  cooldown-reset-not-found: '&cNie znaleziono gracza &f{PLAYER}&c. Podaj nick znanego gracza lub all.'
  web-removed: '&7Usunięto &f{COUNT} &7pajęczyn w pobliżu.'
  bag-error: '&cNie można odczytać lub zapisać torby. Zgłoś błąd administracji.'
  bag-invalid: '&cTorba musi być pojedynczym przedmiotem z poprawnym ID.'
  bag-in-use: '&cTa torba jest już otwarta przez innego gracza.'
  bag-stored: '&dTorba Misako &8| &7Zebrano &f{COUNT} &7przedmiotów z zabójstwa.'
