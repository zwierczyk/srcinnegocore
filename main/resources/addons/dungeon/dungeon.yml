music-loop-seconds: 50
music-volume: 1.3
music-sound: minecraft:eventmusic
music-fadeout-sound: minecraft:eventmusic_fadeout
music-fadein-sound: minecraft:eventmusic_fadein
music-fadeout-ticks: 140
music-quiet-ticks: 30
music-fadein-ticks: 140
ambient-loop-seconds: 35
ambient-volume: 0.7
ambient:
  level-1: minecraft:event.dungeon_ambient_1
  level-2: minecraft:event.dungeon_ambient_2
  level-3: minecraft:event.dungeon_ambient_3
dash-cooldown-seconds: 4
revive-seconds: 10
revive-radius: 4.5
# Po wipe (cala druzyna martwa): GUI kup/anuluj VPLN (/portfel).
wipe-revive-seconds: 25
wipe-revive-cost: 10
spectator-teammate-radius: 12.0
death-hold-ticks: 50
upgrade-timeout-ticks: 240
coin-shop-timeout-ticks: 240
# Sklep za coiny tylko co N zakonczonych fal (ulepszenia darmowe sa nadal co fale).
coin-shop-every-waves: 4
# Komendy konsoli po wygranej. {player} = nick gracza.
win-rewards:
  free:
    - "give {player} gold_ingot 16"
  premium:
    - "give {player} gold_ingot 48"
    - "give {player} diamond 8"
# Baza monety po wygranej (/adungeon coinprize). Final = amount × moneyMultiplier (free x1, 1t x3 … 5t x7).
coin-prize-amount: 0
coin-prize-command: "eco give {player} {amount}"
# Baza Vault za kazdego bossa (/adungeon coinreward). Final = amount × moneyMultiplier.
coin-reward-amount: 0
# HollyEconomy ($) za kazdy 1 dungeon coin podniesiony z ziemi — kasa zostaje po dungeonie (jak /ulepsz).
coin-pickup-vault: 1
# Pule itemow po bossie — FREE i PREMIUM sa osobne.
# /adungeon reward boss <1-3> free   → GUI tylko free
# /adungeon reward boss <1-3> premium → GUI tylko premium
# Zapis jednej puli NIE rusza drugiej.
boss-rewards:
  free:
    1: []
    2: []
    3: []
  premium:
    1: []
    2: []
    3: []
template-world: ninjaevent
world-prefix: ninja_dungeon_
difficulty: HARD
rejoin-seconds: 480
tutorial-seconds: 35
tutorial-slide-ticks: 70
prepare-seconds: 4
boss-cinematic-seconds: 4
cinematic-fly-ticks: 100
mobs-per-wave-base: 5
# Skalowanie HP z liczby osob (5 graczy nie powinno x2.5 HP).
# Final HP = baza × (solo-mult LUB 1+(gracze-1)×per) × mob/boss-hp-mult
party-hp-per-player: 0.14
party-boss-hp-per-player: 0.12
solo-mob-hp-mult: 0.80
solo-boss-hp-mult: 0.55
mob-hp-mult: 0.75
boss-hp-mult: 0.72
# Extra moby na fale na kazdego dodatkowego gracza.
party-mobs-per-player: 1
knockback-resistance: 0.9
# Max poziom Protection z upgrade'ow (netherite + wysoki Prot = bossy biją za 0.5❤).
max-protection: 2
# Obrazenia mobow/bossow vs gracze (1.0 = normalnie, 0.7 = latwiej o 30%).
mob-damage-mult: 0.60

kit:
  golden-apples: 12
  steak: 32
  sword-custom-model-data: 1

bosses:
  1:
    name: '<gradient:#FF3B3B:#FF9B00><bold>Sensei Kuro</bold></gradient></shadow>'
    type: WITHER_SKELETON
    health: 220
  2:
    name: '<gradient:#FF9B00:#FFD900><bold>Oni Masamune</bold></gradient></shadow>'
    type: PIGLIN_BRUTE
    health: 280
  3:
    name: '<gradient:#C800FF:#FC73F7><bold>Smoczy Ninja Ryujin</bold></gradient></shadow>'
    type: RAVAGER
    health: 340

