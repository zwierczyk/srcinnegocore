settings:
  # Wspólny limit dla całego serwera: wszystkie skrzynki i tryby otwarcia razem.
  # Liczymy każde ostatnie 15 sekund. Podgląd skrzynki nie zużywa limitu.
  global-open-limit:
    max-openings: 20
    window-seconds: 15
  openCooldownMillis: 200
  cooldown-version: 1
  consumeKey: true
  luckyBlockOpenType: ANIMATION

chance-lore:
  - ''
  - '&8> &7Szansa: &f{chance}%'

reward-rotations:
  luckyblock:
    enabled: true
    interval-minutes: 90
    source-item-id: hak
    item-ids:
      - hak
      - rozdzka-harrego-pottera
      - smocza-fajerwerka
      - granat-odepchniecia
      - sniezka-teleportacji
      - granat-uwiezienia

sounds:
  open-gui:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0

messages:
  global-open-limit: '&cLimit otwierania skrzynek na serwerze został osiągnięty. Spróbuj ponownie za &f{time}s&c.'
