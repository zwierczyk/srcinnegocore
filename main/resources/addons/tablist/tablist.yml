scoreboard:
  enabled: true
  auto-shadow:
    enabled: false
    color: '#000000C0'
  # Pełne odświeżenie placeholderów co 3s (pieniądze, kille, punkty…).
  update-seconds: 3
  update-batch-size: 24
  periodic-refresh: true
  # Pokazuj sekcję klanu w scoreboardzie (nawet jeśli gracz ma klan)
  show-clan-section: true
  lines:
    - ''
    - '&#FF0000&l| &f<shadow:#000000C0> Sektor: <gradient:#00FFC1:#00FF5A>%core_sector%</gradient></shadow>'
    - '&#FF0000&l| &f<shadow:#000000C0> Aby zmienic wpisz: <gradient:#00FFC1:#00FF5A>/ch</gradient></shadow>'
    - '&#FF0000&l|'
    - '&#FF0000&l| &f<shadow:#000000C0> Nick: <gradient:#00C1FF:#00D6FF>%player_name%</gradient></shadow>'
    - '&#FF0000&l| &f<shadow:#000000C0> Czas gry: <gradient:#9FFF00:#2AFF5B:#A9FF00>%core_playtime%</gradient></shadow>'
    - '&#FF0000&l| &f<shadow:#000000C0> Pieniądze: &#00FF4F%core_balance%$
    &8(&#FF9B00%core_vpln%&8)</shadow>'
    - '&#FF0000&l|'
    - '&#FF0000&l| &f<shadow:#000000C0> Punkty: <gradient:#A7A7A7:#B5CFD4:#969798>%core_points%</gradient>
    &8♦ &f#{player_points_position}</shadow>'
    - '&#FF0000&l| &f<shadow:#000000C0> Zabójstwa: &#FF0000%core_kills%</shadow>'
    - '&#FF0000&l| &f<shadow:#000000C0> Śmierci: &#8DC4BB%core_deaths%</shadow>'
    - '&#FF0000&l|'
    - '&#FF0000&l| &f<shadow:#000000C0> Boss: <gradient:#FF5C5C:#FFB800>{BOSS_NAME}</gradient> &8• &f{BOSS_TIME}</shadow>'
    - ''
    - '{clan_section}'
  no-clan-lines:
    - '&f<shadow:#000000C0>ꑢ &cNie posiadasz klanu</shadow>'
    - '&f<shadow:#000000C0>ꑢ &cZaloz klan pod: &#FF0000/klan zaloz &f\\<TAG></shadow>'
  in-clan-lines:
    - '&f<shadow:#000000C0>ノ Klan: &#32F55F{clan_name}</shadow>'
    - '&f<shadow:#000000C0>ノ Punkty: &#32F55F{clan_points} &8● &f#{clan_points_position}</shadow>'
tab:
  enabled: true
  update-seconds: 30
  update-batch-size: 8
  name-tag-update-batch-size: 8
  custom-tab-enabled: true
  auto-shadow:
    enabled: false
    color: '#000000C0'
  fill-empty-rows: false
  # System animacji dla custom tab rows - różne topki się zmieniają
  animation:
    enabled: false
    # Interwał zmiany strony w sekundach
    interval-seconds: 10
    # Lista stron do rotacji
    pages:
      - 'top-players-points'
      - 'top-players-kills'
      - 'top-players-time'
      - 'top-players-money'
      - 'top-clans-points'
      - 'top-clans-kills'
  custom-tab-skin:
    # Value z MineSkin dla glowek w custom tabie
    value: 
    # Signature z MineSkin dla glowek w custom tabie. Moze byc puste.
    signature: 
  identity-update-interval-ticks: 400
  full-row-update-interval-ticks: 300
  update-rows-on-move: false
  max-adaptive-full-row-update-interval-ticks: 600
  tabtop:
    user-format: '#{PLACE} {STATUS} {NAME} ({VALUE})'
    clan-format: '#{PLACE} {STATUS} {NAME} ({VALUE})'
    online-symbol: '&a•'
    offline-symbol: '&c•'
    colors:
      '2': '&x&F&F&B&A&0&0'
      '1': '&x&F&F&1&8&1&8'
      default: '&x&A&F&D&C&F&F'
      '3': '&x&7&2&F&F&4&1'
    # Tekst wyswietlany zamiast numeru {PLACE} w topce taba. Klucz default obsluguje pozycje bez osobnego wpisu.
    position-labels:
      '1': '&fび'
      '2': '&fが'
      '3': '&fい'
      '4': '&f4'
      '5': '&f5'
      '6': '&f6'
      '7': '&f7'
      '8': '&f8'
      '9': '&f9'
      '10': '&f10'
      '11': '&f11'
      '12': '&f12'
      '13': '&f13'
      '14': '&f14'
      '15': '&f15'
      default: '{PLACE}'
    o-ld_default_format: '#{PLACE} {STATUS} {NAME} ({VALUE})'
    de-fa-ult_points_format: '{PLACE} &f{NAME} &8⁂ &8(&a{VALUE}ptk.&8)'
    o-ld_default_colors:
      '1': '&x&F&F&1&8&1&8'
      default: '&x&A&F&D&C&F&F'
      '3': '&x&7&2&F&F&4&1'
      '2': '&x&F&F&B&A&0&0'
  adaptive-refresh: true
  adaptive-max-ticks: 400
  sort-by-luck-perms: true
  # Sortowanie: najlepsza (najwyższa) grupa gracza z rank-order — nie tylko primary.
  # Dzięki temu właściciel + odebrane VIP zostaje na górze tabu. Puste wpisy w liście są pomijane.
  # sorting:
  #   fallback-group: default
  #   unknown-group-weight: 999
  #   sorting-types:
  #     - 'GROUPS:root,admin,mod,helper,vip,default'
  rank-order:
    - root
    - wlasciciel
    - owner
    - zarzad
    - headadmin
    - hadmin
    - admin
    - mod
    - moderator
    - kidmod
    - jmod
    - helper
    - thelper
    - trialhelper
    - builder
    - budowniczy
    - partner
    - tworca
    - media
    - youtuber
    - yt
    - tiktok
    - minimedia
    - sponsor
    - patron
    - elita
    - champion
