  deleted: "&#60FF8B✔ Usunięto generator!"
  exists: "&#FF5C5C✖ Generator o tej nazwie już istnieje!"
  not-found: "&#FF5C5C✖ Nie znaleziono generatora!"
  invalid-size: "&#FF5C5C✖ Argument musi być w przedziale 1-30."
  invalid-time: "&#FF5C5C✖ Czas musi być większy niż 1 sekunda."
  invalid-material: "&#FF5C5C✖ Nieprawidłowy materiał."
  teleported: "&#60FF8B✔ Przeteleportowano do generatora!"
  reloaded: "&#60FF8B✔ Przeładowano konfigurację generatorów!"
  wool-shears-only: "&#FF5C5C✖ Ten generator możesz kopać tylko nożyczkami z ulepsz!"
