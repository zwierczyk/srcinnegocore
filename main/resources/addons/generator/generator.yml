# time: milisekundy (renew-seconds * 1000)

continuous-regeneration:
  enabled: false
  check-interval-ticks: 20
  replace-all-blocks: true
settings:
  animation-last-seconds: 4
hologram:
  enabled: true
  height-offset: 1.45
  update-interval-ticks: 5
  icon-offset: 0.85
  text-offset: -0.35
  background: true
  shadow: true
  icon-enabled: true
regeneration:
  seconds-per-layer: 1.5
  blocks-per-tick: 4
  ticks-between-batches: 3
  effects: true
hologramLines:
  - "#ICON:{TYPE}"
  - "&f⛏ &8| &7Regeneracja za &f&n{TIME}&8 | ⛏"
messages:
