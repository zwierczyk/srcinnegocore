      - '&7Filtruj przedmioty według'
      - '&7typu zbroi.'
      - ''
      - '&fKliknij, aby zmienić kategorię'
    categories:
      Hełmy:
        - material: NETHERITE_HELMET
          customModelData: -1  # -1 = ignoruj customModelData
        - material: DIAMOND_HELMET
          customModelData: -1
        - material: IRON_HELMET
          customModelData: -1
        - material: GOLDEN_HELMET
          customModelData: -1
        - material: LEATHER_HELMET
          customModelData: -1
        - material: CHAINMAIL_HELMET
          customModelData: -1
        - material: TURTLE_HELMET
