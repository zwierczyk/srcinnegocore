# Konfiguracja filtrów dla rynku
# Każdy filtr może mieć wiele kategorii, każda kategoria może filtrować po materiale i/lub customModelData

filters:
  all:
    # Filtr "Wszystko" - bez kategorii, pokazuje wszystkie itemy
    icon:
      material: NETHER_STAR
      customModelData: 0
    name: '&8× &#00C356&lWszystko'
    lore:
      - ''
      - '&7Wyświetla wszystkie przedmioty'
      - '&7dostępne na rynku.'
      - ''
      - '&fKliknij, aby wybrać'
    categories: {}

  armor:
    # Filtr zbroi - kategorie: hełmy, napierśniki, spodnie, buty, elytry
